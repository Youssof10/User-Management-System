<div class="login-container">
  <h2>Login (Reactive Forms)</h2>

  <!-- Error Message Display -->
  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <!-- Login Form: Bind to the FormGroup -->
  <form [formGroup]="loginForm" (ngSubmit)="onLoginSubmit()">
    
    <!-- Email Field -->
    <div class="form-group">
      <label for="email">Email</label>
      <input 
        type="email" 
        id="email" 
        formControlName="email" 
        class="form-control"
      >
      <!-- Validation Check (using safe navigation) -->
      <div 
        *ngIf="loginForm?.get('email')?.invalid && (loginForm?.get('email')?.dirty || loginForm?.get('email')?.touched)" 
        class="text-danger"
      >
        <!-- Error Display (using the 'f' getter with bracket notation) -->
        <div *ngIf="f['email']?.errors?.['required']">Email is required.</div>
        <div *ngIf="f['email']?.errors?.['email']">Please enter a valid email address.</div>
      </div>
    </div>

    <!-- Password Field -->
    <div class="form-group">
      <label for="password">Password</label>
      <input 
        type="password" 
        id="password" 
        formControlName="password" 
        class="form-control"
      >
      <!-- Validation Check (using safe navigation) -->
      <div 
        *ngIf="loginForm?.get('password')?.invalid && (loginForm?.get('password')?.dirty || loginForm?.get('password')?.touched)" 
        class="text-danger"
      >
        <!-- Error Display (using the 'f' getter with bracket notation) -->
        <div *ngIf="f['password']?.errors?.['required']">Password is required.</div>
      </div>
    </div>
    
    <!-- Submit Button: Removed '?' on loginForm.invalid -->
    <button 
      type="submit" 
      [disabled]="loginForm.invalid || isLoading" 
      class="btn btn-primary"
    >
      <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
      {{ isLoading ? 'Logging in...' : 'Login' }}
    </button>
  </form>

  <!-- Navigation Link to Registration -->
  <p class="mt-3">
    Don't have an account? 
    <a (click)="goToRegister()" class="register-link">Register here</a>
  </p>
</div>
